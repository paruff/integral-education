name: CI Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build And Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # The same hook definition as local commits (lefthook.yml); the build runs below.
      - name: Pre-commit Hooks
        env:
          LEFTHOOK_EXCLUDE: build
        run: npx lefthook run pre-commit --all-files

      - name: Generate Content Graph
        run: node scripts/generate-content-graph.js

      - name: Record Build Start
        id: build-start
        run: echo "time=$(date +%s%N)" >> $GITHUB_OUTPUT

      - name: Build Site
        id: build
        # Builds the main site, then every stage site (FR-18) and link-checks each one.
        run: npm run build:sites
        timeout-minutes: 10

      # WCAG 2.2 AA (NFR-02): axe-core over key pages of the built site; exits 1 on any violation.
      - name: Accessibility Audit
        run: |
          npx docusaurus serve --port 3099 --no-open &
          curl --retry 30 --retry-delay 1 --retry-connrefused -fsS -o /dev/null http://localhost:3099/integral-education/
          node scripts/audit-a11y.mjs

      - name: Record Build End
        id: build-end
        run: echo "time=$(date +%s%N)" >> $GITHUB_OUTPUT

      - name: Measure Build Metrics
        id: metrics
        run: |
          BUILD_TIME_MS=$(( ${{ steps.build-end.outputs.time }} - ${{ steps.build-start.outputs.time }} ))
          BUILD_TIME_S=$(( BUILD_TIME_MS / 1000000000 ))
          SEARCH_INDEX_SIZE=$(wc -c < build/search-index.json 2>/dev/null || echo 0)
          echo "build_time_seconds=${BUILD_TIME_S}" >> $GITHUB_OUTPUT
          echo "search_index_bytes=${SEARCH_INDEX_SIZE}" >> $GITHUB_OUTPUT

          # Extract content graph stats
          if [ -f docs/.content-graph-stats.json ]; then
            GOLD_STANDARD=$(node -e "console.log(require('./docs/.content-graph-stats.json').goldStandardCompliance.percentage)")
            MODULES=$(node -e "console.log(require('./docs/.content-graph-stats.json').goldStandardCompliance.total)")
          else
            GOLD_STANDARD=0
            MODULES=0
          fi
          echo "gold_standard_pct=${GOLD_STANDARD}" >> $GITHUB_OUTPUT
          echo "module_count=${MODULES}" >> $GITHUB_OUTPUT

      # Only what main ships is handed to deploy: the same commit, built and tested here.
      - name: Build Pages Artifact (published sites only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GOATCOUNTER_CODE: paruff
        run: |
          node scripts/build-sites.mjs --published-only
          scripts/hash-build.sh build | tee build/.build-hash

      - name: Upload Site Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Report Metrics
        if: always()
        run: |
          echo "## 📊 Build Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build time | ${{ steps.metrics.outputs.build_time_seconds }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Search index size | ${{ steps.metrics.outputs.search_index_bytes }} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| Module count | ${{ steps.metrics.outputs.module_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gold-standard compliance | ${{ steps.metrics.outputs.gold_standard_pct }}% |" >> $GITHUB_STEP_SUMMARY
