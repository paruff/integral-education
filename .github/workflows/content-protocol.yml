name: Content Protocol

on:
  # No paths filter on PRs: Protocol Guardrails is a required check, and a
  # path-filtered required check never reports on non-docs PRs (P11-05).
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - .github/workflows/content-protocol.yml

permissions:
  contents: read

jobs:
  protocol-guardrails:
    name: Protocol Guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check For Hype Terms
        shell: bash
        run: |
          set -euo pipefail
          # Discourage overclaiming language in learning content.
          # Exclude quality/protocol docs that reference hype terms as examples to avoid.
          if grep -rniE "\\b(breakthrough|cure|revolutionary|guaranteed)\\b" docs README.md | grep -v '^docs/quality/'; then
            echo "Found prohibited hype language. Replace with evidence-quality wording."
            exit 1
          fi

      - name: Check Shadow Safety Language
        shell: bash
        run: |
          set -euo pipefail
          # Only check learner-facing modules in docs/modules/ — exclude archived
          # specs (docs/features/) and reference pages (docs/safety/)
          shadow_files=$(find docs/modules -type f | grep -iE "shadow|safety" || true)
          if [[ -z "${shadow_files}" ]]; then
            echo "No shadow/safety files detected in docs. Skipping safety-language check."
            exit 0
          fi

          required_patterns=(
            "consent"
            "contraindication|not suitable"
            "stop rule|stop rules"
            "grounding"
            "escalation"
          )

          while IFS= read -r f; do
            for p in "${required_patterns[@]}"; do
              if ! grep -qiE "${p}" "${f}"; then
                echo "Missing required safety language pattern '${p}' in ${f}"
                exit 1
              fi
            done
          done <<< "${shadow_files}"

          echo "Shadow/safety language checks passed."

      - name: Check AQAL Coverage Tokens
        shell: bash
        run: |
          set -euo pipefail
          aqal_files=$(find docs -type f | grep -iE "aqal|integral|module|pathway" || true)
          if [[ -z "${aqal_files}" ]]; then
            echo "No AQAL/integral files detected for token check."
            exit 0
          fi

          tokens=(
            "Quadrant|I, We, It, Its"
            "Level"
            "Line"
            "State"
            "Type"
          )

          while IFS= read -r f; do
            missing=0
            for t in "${tokens[@]}"; do
              if ! grep -qiE "${t}" "${f}"; then
                missing=1
              fi
            done
            if [[ "${missing}" -eq 1 ]]; then
              echo "AQAL token coverage may be incomplete in ${f}"
            fi
          done <<< "${aqal_files}"
