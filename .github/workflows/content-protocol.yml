name: Content Protocol

on:
  # No paths filter on PRs: Protocol Guardrails is a required check, and a
  # path-filtered required check never reports on non-docs PRs (P11-05).
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - .github/workflows/content-protocol.yml

permissions:
  contents: read

jobs:
  protocol-guardrails:
    name: Protocol Guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check For Hype Terms
        shell: bash
        run: |
          set -euo pipefail
          # Discourage overclaiming language in learning content.
          # Exclude quality/protocol docs that reference hype terms as examples to avoid.
          if grep -rniE "\\b(breakthrough|cure|revolutionary|guaranteed)\\b" docs README.md | grep -v '^internal/quality/'; then
            echo "Found prohibited hype language. Replace with evidence-quality wording."
            exit 1
          fi

      - name: Check Shadow Safety Language
        shell: bash
        run: |
          set -euo pipefail
          # Learner-facing modules in docs/modules/ that are Tier 2 (safety_tier: 2 in
          # frontmatter) or named shadow/safety. Archived specs (docs/features/) and
          # reference pages (docs/safety/) are not checked.
          shadow_files=$( { grep -lE '^safety_tier: *2' docs/modules/* || true; find docs/modules -type f | grep -iE "shadow|safety" || true; } | sort -u)
          if [[ -z "${shadow_files}" ]]; then
            echo "No Tier 2 or shadow/safety modules detected. Skipping safety-language check."
            exit 0
          fi

          # Tier 2 modules that predate this check and still lack some of the wording below.
          # They warn instead of failing until a human reviews and writes the missing
          # safety text (AGENTS.md: safety-sensitive output needs human sign-off).
          # Remove a line here when its module is fixed; never add to this list.
          known_gaps="
          docs/modules/affect-labelling-somatic-correlation.md
          docs/modules/co-regulation-relational-attunement.md
          docs/modules/cross-difference-dialogue-trust-building.md
          docs/modules/relational-repair-conflict-navigation.md
          docs/modules/self-line-integration-practice.mdx
          docs/modules/somatic-line-overview.md
          "

          required_patterns=(
            "consent"
            "contraindication|not suitable"
            "stop rule|stop rules"
            "grounding"
            "escalation"
          )

          failed=0
          while IFS= read -r f; do
            for p in "${required_patterns[@]}"; do
              if ! grep -qiE "${p}" "${f}"; then
                if grep -qxF "${f}" <<< "$(echo "${known_gaps}" | sed 's/^ *//')"; then
                  echo "::warning file=${f}::Known gap: missing safety language pattern '${p}'"
                else
                  echo "::error file=${f}::Missing required safety language pattern '${p}'"
                  failed=1
                fi
              fi
            done
          done <<< "${shadow_files}"

          if [[ "${failed}" -eq 1 ]]; then exit 1; fi
          echo "Shadow/safety language checks passed."

      - name: Check AQAL Coverage Tokens
        shell: bash
        run: |
          set -euo pipefail
          aqal_files=$(find docs -type f | grep -iE "aqal|integral|module|pathway" || true)
          if [[ -z "${aqal_files}" ]]; then
            echo "No AQAL/integral files detected for token check."
            exit 0
          fi

          tokens=(
            "Quadrant|I, We, It, Its"
            "Level"
            "Line"
            "State"
            "Type"
          )

          while IFS= read -r f; do
            missing=0
            for t in "${tokens[@]}"; do
              if ! grep -qiE "${t}" "${f}"; then
                missing=1
              fi
            done
            if [[ "${missing}" -eq 1 ]]; then
              echo "AQAL token coverage may be incomplete in ${f}"
            fi
          done <<< "${aqal_files}"
