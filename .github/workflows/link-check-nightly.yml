name: Link Check (nightly)

# External links are checked here, off the PR gate, so a third-party outage cannot block a merge.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --no-progress --accept 200,206,301,302,429 --exclude-loopback --scheme https --scheme http --root-dir . 'docs/**/*.md' 'docs/**/*.mdx' README.md
          fail: false
          output: lychee-report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One open issue is kept up to date, so a link that stays broken is one issue, not one per night.
      - name: Open or update the issue on failure
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Nightly link check failed
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --label documentation --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | sort_by(.number) | reverse | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file lychee-report.md
            gh issue comment "$existing" --body "Still failing on $(date -u +%F). The description above is the latest report."
          else
            gh issue create --title "$TITLE" --label documentation --body-file lychee-report.md
          fi
