# lefthook.yml — pre-commit hooks for Integral Education Platform
# Run `npx lefthook install` after cloning to activate

pre-commit:
  parallel: true
  commands:
    build:
      tags: [core, safety]
      run: npm run build
      skip:
        - merge
        - rebase
      priority: 1

    no-h1-in-body:
      tags: [content, wcag]
      run: node scripts/check-no-h1.mjs
      skip:
        - merge
        - rebase
      priority: 2

    no-placeholders:
      tags: [content, quality]
      run: node scripts/check-no-placeholders.mjs
      skip:
        - merge
        - rebase
      priority: 2

    unit-tests:
      tags: [core, quality]
      run: npm test
      skip:
        - merge
        - rebase
      priority: 2

    frontmatter-format:
      tags: [content, validation]
      run: node scripts/validate-frontmatter.js
      skip:
        - merge
        - rebase
      priority: 2

    retention-check:
      tags: [content, quality]
      run: node scripts/check-retention.mjs
      skip:
        - merge
        - rebase
      priority: 2

    toolkit-check:
      tags: [content, quality]
      run: node scripts/check-toolkit.mjs
      skip:
        - merge
        - rebase
      priority: 2

    quickstart-check:
      tags: [content, quality]
      run: node scripts/check-quickstarts.mjs
      skip:
        - merge
        - rebase
      priority: 2

    no-merge-conflicts:
      tags: [git, safety]
      run: node scripts/check-no-merge-conflicts.mjs
      skip:
        - merge
        - rebase
      priority: 1
